<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qontrol - Olvidé mi contraseña</title>
    <link rel="stylesheet" href="../CSS/index.css">
</head>
<body>
    <div>
        <div class="logo2">
            <img src="../IMG/logo-solo-nombre.wep.jpg" alt="Logo Qontrol" width="250">
        </div>
        <div class="olvido-contra-p">
            <h1>¿Se te olvido la contraseña?</h1>
            <p>¡No te preocupes!</p>
            <p>Ingresa tu correo electrónico y te enviaremos un código para que puedas </p>
            <p>reestablecer la contraseña.</p>
        </div>
        <div class="se_te_olvi_boton">
            <form>
                <input 
                    type="email" 
                    class="input-olv" 
                    placeholder="qontrol@qontrol.com"
                >
                <button type="submit" class="button-olv" src="olvido_contra_2.html">Enviar</button>
            </form>
        </div>
        <div class="reg">
            <span><a href="./registro.html" class="enlace">Crear cuenta nueva</a></span>
        </div>
    </div>
</body>
</html>
