<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qontrol - Olvidé mi contraseña 2</title>
    <link rel="stylesheet" href="../CSS/inicio.css">
</head>
<body>
    <div class="container">
        <div class="logo2">
            <img src="../Image/logo-solo-nombre.wep.jpg" alt="Logo Qontrol" width="250">
        </div>
        <div class="icono-codigo">
            <span>12 </span>
        </div>
        <div class="olvido-contra-p">
            <h1>Ingresa el codigo que llego a tu correo</h1>
        </div>
        <div class="se_te_olvi_boton">
            <form>
                <input 
                    type="number" 
                    class="input-olv" 
                    maxlength="6"
                    minlength="6"
                    placeholder="Ingresa el codigo"
                >
                <button type="submit" class="button-olv">Enviar</button>
            </form>
        </div>
        <div class="reg">
            <p class="no-llego-contra">No me llego el codigo</p>
            <span><a href="#" class="enlace">Volver a enviar</a></span>
        </div>
    </div>
</body>
</html>
